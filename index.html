<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Chat NhanC - Cloud</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #36393f; color: #dcddde; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #202225; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px; border-radius: 8px; position: relative; word-wrap: break-word; }
        .message.mine { align-self: flex-end; background-color: #5865f2; color: white; }
        .message.others { align-self: flex-start; background-color: #4f545c; color: #dcddde; }
        .sender-name { font-size: 10px; font-weight: bold; margin-bottom: 3px; display: block; color: #00aff4; }
        .message.mine .sender-name { color: #ffffff; }
        .input-area { background-color: #40444b; padding: 20px; display: flex; gap: 10px; }
        input { background-color: #2f3136; border: none; padding: 12px; color: white; border-radius: 5px; outline: none; }
        #user-input { width: 100px; }
        #msg-input { flex: 1; }
        button { background-color: #5865f2; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #4752c4; }
    </style>
</head>
<body>

<div class="header">Phòng Chat Trực Tuyến NhanC</div>
<div id="chat-window"></div>
<div class="input-area">
    <input type="text" id="user-input" placeholder="Tên bạn...">
    <input type="text" id="msg-input" placeholder="Nhập nội dung chat...">
    <button onclick="sendMessage()">Gửi</button>
</div>

<script>
    // --- CẤU HÌNH FIREBASE CỦA BẠN ---
    const firebaseConfig = {
        databaseURL: "https://helotrongnhan-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Lắng nghe tin nhắn mới
    database.ref("messages").on("value", (snapshot) => {
        const chatWindow = document.getElementById("chat-window");
        chatWindow.innerHTML = "";
        const myName = document.getElementById("user-input").value;

        snapshot.forEach((childSnapshot) => {
            const data = childSnapshot.val();
            const isMe = data.sender === myName;
            
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            msgDiv.classList.add(isMe ? "mine" : "others");
            
            msgDiv.innerHTML = `<span class="sender-name">${data.sender}</span>${data.text}`;
            chatWindow.appendChild(msgDiv);
        });
        chatWindow.scrollTop = chatWindow.scrollHeight;
    });

    // Hàm gửi tin nhắn
    function sendMessage() {
        const sender = document.getElementById("user-input").value || "Ẩn danh";
        const text = document.getElementById("msg-input").value;
        
        if (text.trim() !== "") {
            database.ref("messages").push({
                sender: sender,
                text: text,
                serverTime: firebase.database.ServerValue.TIMESTAMP
            });
            document.getElementById("msg-input").value = "";
        }
    }

    // Gửi bằng phím Enter
    document.getElementById("msg-input").addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
