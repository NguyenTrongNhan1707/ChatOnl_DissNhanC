<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chat - NhanC</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --bg-dark: #36393f; --bg-side: #2f3136; --accent: #5865f2; --text-main: #dcddde; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* --- MÀN HÌNH LOGIN --- */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #2f3136; position: absolute; width: 100%; z-index: 100; }
        .login-card { background: #36393f; padding: 40px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); width: 320px; text-align: center; }
        .login-card h2 { margin-top: 0; color: white; }
        .login-card input { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #202225; background: #202225; color: white; outline: none; }
        .btn { width: 100%; padding: 12px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; transition: 0.2s; }
        .login-btn { background: var(--accent); }
        .reg-btn { background: #43b581; }
        .btn:hover { opacity: 0.8; }

        /* --- MÀN HÌNH CHAT --- */
        #chat-screen { display: none; flex-direction: column; height: 100vh; width: 100%; }
        .header { background-color: #202225; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 10; }
        
        #main-container { display: flex; flex: 1; overflow: hidden; }

        /* --- SIDEBAR NGƯỜI DÙNG --- */
        #user-sidebar { width: 220px; background-color: #2f3136; border-right: 1px solid #202225; display: flex; flex-direction: column; padding: 10px; overflow-y: auto; }
        .sidebar-title { font-size: 12px; font-weight: bold; color: #8e9297; margin-bottom: 15px; padding-left: 5px; text-transform: uppercase; }
        .user-item { display: flex; align-items: center; padding: 8px; border-radius: 4px; margin-bottom: 5px; color: #8e9297; cursor: default; }
        .user-item.active { color: white; background: rgba(79, 84, 92, 0.3); }
        .user-avatar { width: 32px; height: 32px; background: #5865f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; margin-right: 12px; flex-shrink: 0; }
        .user-name-text { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- VÙNG CHAT CHÍNH --- */
        #chat-main { flex: 1; display: flex; flex-direction: column; background-color: #36393f; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 15px; border-radius: 15px; position: relative; line-height: 1.4; }
        .message.mine { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .message.others { align-self: flex-start; background-color: #4f545c; color: white; border-bottom-left-radius: 4px; }
        .sender-name { font-size: 11px; font-weight: bold; margin-bottom: 3px; display: block; opacity: 0.7; }
        
        /* Toolbar Icon */
        .toolbar { background: #2f3136; padding: 8px 20px; display: flex; gap: 12px; border-top: 1px solid #40444b; }
        .icon-btn { background: #40444b; border: none; padding: 6px; border-radius: 4px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: var(--accent); }
        .icon-btn img { pointer-events: none; }

        /* Input area */
        .input-area { background-color: #40444b; padding: 15px 20px 25px 20px; display: flex; gap: 10px; }
        #msg-input { flex: 1; background: #2f3136; border: none; padding: 12px 18px; color: white; border-radius: 20px; outline: none; }
        .send-btn { background: var(--accent); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }

        @media (max-width: 700px) { #user-sidebar { display: none; } }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h2>Cloud Chat</h2>
        <input type="text" id="user-name" placeholder="Tên đăng nhập">
        <input type="password" id="pass-word" placeholder="Mật khẩu">
        <button class="btn login-btn" onclick="login()">Đăng nhập</button>
        <button class="btn reg-btn" onclick="register()">Đăng ký</button>
    </div>
</div>

<div id="chat-screen">
    <div class="header">
        <div style="font-weight:bold; color: white;">Cloud Chat - <span id="display-user" style="color: #00aff4;"></span></div>
        <button onclick="logout()" style="background:none; border:none; color:#ff4747; cursor:pointer; font-weight:bold;">Đăng xuất</button>
    </div>
    
    <div id="main-container">
        <div id="user-sidebar">
            <div class="sidebar-title">Người dùng đang online</div>
            <div id="online-list"></div>
        </div>

        <div id="chat-main">
            <div id="chat-window"></div>
            
            <div class="toolbar">
                <button class="icon-btn" onclick="addIcon(':smile:')"><img src="./mile.png" width="22" height="22"></button>
                <button class="icon-btn" onclick="addIcon(':like:')"><img src="./like.png" width="22" height="22"></button>
                <button class="icon-btn" onclick="addIcon(':heart:')"><img src="./heart.png" width="22" height="22"></button>
                <button class="icon-btn" onclick="addIcon(':lol:')"><img src="./lol.png" width="22" height="22"></button>
            </div>

            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Nhập nội dung chat...">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    // CẤU HÌNH FIREBASE
    const firebaseConfig = { databaseURL: "https://helotrongnhan-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let currentUsername = "";

    // --- LOGIC TÀI KHOẢN ---
    function login() {
        const u = document.getElementById("user-name").value.trim();
        const p = document.getElementById("pass-word").value.trim();
        if(!u || !p) return alert("Vui lòng điền đủ!");

        database.ref("users/" + u).once("value", (snapshot) => {
            if (snapshot.exists()) {
                const userData = snapshot.val();
                if (userData.password === p) {
                    currentUsername = u;
                    startChat();
                } else { alert("Sai mật khẩu!"); }
            } else { alert("Tài khoản không tồn tại!"); }
        });
    }

    function register() {
        const u = document.getElementById("user-name").value.trim();
        const p = document.getElementById("pass-word").value.trim();
        if(!u || !p) return alert("Nhập đủ thông tin!");

        database.ref("users/" + u).once("value", (snapshot) => {
            if (snapshot.exists()) {
                alert("Tên này đã có người dùng!");
            } else {
                database.ref("users/" + u).set({ password: p, createdAt: Date.now() })
                .then(() => alert("Đăng ký thành công! Giờ hãy đăng nhập."));
            }
        });
    }

    function logout() {
        if(currentUsername) database.ref("status/" + currentUsername).set(false);
        location.reload();
    }

    // --- LOGIC CHAT ---
    function startChat() {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "flex";
        document.getElementById("display-user").innerText = currentUsername;
        
        // Cập nhật trạng thái online
        database.ref("status/" + currentUsername).set(true);
        database.ref("status/" + currentUsername).onDisconnect().set(false);

        loadMessages();
        loadOnlineUsers();
    }

    function loadOnlineUsers() {
    // Lấy toàn bộ danh sách users đã đăng ký
    database.ref("users").on("value", (userSnapshot) => {
        // Lấy trạng thái online hiện tại
        database.ref("status").on("value", (statusSnapshot) => {
            const onlineList = document.getElementById("online-list");
            onlineList.innerHTML = "";
            const statuses = statusSnapshot.val() || {};

            userSnapshot.forEach((child) => {
                const name = child.key;
                const isOnline = statuses[name] === true; // Kiểm tra xem có online không
                
                const initial = name.charAt(0).toUpperCase();
                const div = document.createElement("div");
                
                // Nếu online thì thêm class 'active', nếu không thì làm mờ đi
                div.className = `user-item ${isOnline ? 'active' : ''}`;
                div.style.opacity = isOnline ? "1" : "0.4"; // Người offline sẽ bị mờ
                
                div.innerHTML = `
                    <div class="user-avatar" style="background: ${isOnline ? '#5865f2' : '#4f545c'}">${initial}</div>
                    <div class="user-name-text">${name} ${isOnline ? '●' : ''}</div>
                `;
                onlineList.appendChild(div);
            });
        });
    });
}

    function loadMessages() {
        database.ref("messages").limitToLast(50).on("value", (snapshot) => {
            const chatWindow = document.getElementById("chat-window");
            chatWindow.innerHTML = "";
            const icons = { ":smile:": "mile.png", ":like:": "like.png", ":heart:": "heart.png", ":lol:": "lol.png" };

            snapshot.forEach((child) => {
                const data = child.val();
                const isMe = data.sender === currentUsername;
                let text = data.text;

                for (let code in icons) {
                    const imgUrl = "./" + icons[code]; 
                    text = text.split(code).join(`<img src="${imgUrl}" width="22" height="22" style="vertical-align: middle; margin: 0 2px;">`);
                }

                const msgDiv = document.createElement("div");
                msgDiv.className = `message ${isMe ? 'mine' : 'others'}`;
                msgDiv.innerHTML = `<span class="sender-name">${data.sender}</span>${text}`;
                chatWindow.appendChild(msgDiv);
            });
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
    }

    function sendMessage() {
        const input = document.getElementById("msg-input");
        const text = input.value.trim();
        if (text === "") return;
        database.ref("messages").push({
            sender: currentUsername,
            text: text,
            serverTime: firebase.database.ServerValue.TIMESTAMP
        });
        input.value = "";
    }

    function addIcon(code) {
        const input = document.getElementById("msg-input");
        input.value += code;
        input.focus();
    }

    document.getElementById("msg-input").addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
</script>

</body>
</html>
