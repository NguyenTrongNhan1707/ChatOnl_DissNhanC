<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chat - NhanC</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --bg-dark: #36393f; --bg-side: #2f3136; --accent: #5865f2; --text-main: #dcddde; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; overflow: hidden; }
        
        /* Màn hình Login */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #2f3136; }
        .login-card { background: #36393f; padding: 40px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); width: 300px; text-align: center; }
        .login-card h2 { margin-bottom: 20px; color: white; }
        .login-card input { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #202225; background: #202225; color: white; outline: none; }
        .login-btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .reg-btn { background: #43b581; }

        /* Màn hình Chat (Mặc định ẩn) */
        #chat-screen { display: none; flex-direction: column; height: 100vh; }
        .header { background-color: #202225; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 18px; position: relative; }
        .message.mine { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .message.others { align-self: flex-start; background-color: #4f545c; color: white; border-bottom-left-radius: 4px; }
        .sender-name { font-size: 11px; font-weight: bold; margin-bottom: 4px; display: block; opacity: 0.8; }
        .input-area { background-color: #40444b; padding: 20px; display: flex; gap: 12px; }
        #msg-input { flex: 1; background-color: #2f3136; border: none; padding: 12px 15px; color: white; border-radius: 25px; outline: none; }
        .send-btn { background-color: var(--accent); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h2>Chào mừng trở lại!</h2>
        <input type="text" id="user-name" placeholder="Tên đăng nhập">
        <input type="password" id="pass-word" placeholder="Mật khẩu">
        <button class="login-btn" onclick="login()">Đăng nhập</button>
        <button class="login-btn reg-btn" onclick="register()">Đăng ký</button>
    </div>
</div>

<div id="chat-screen">
    <div class="header">
        <h1>Cloud Chat Online</h1>
        <button onclick="location.reload()" style="background:none; border:none; color:white; cursor:pointer;">Đăng xuất</button>
    </div>
    <div id="chat-window"></div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Aa">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    // --- CẤU HÌNH FIREBASE ---
    const firebaseConfig = { databaseURL: "https://helotrongnhan-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let currentUsername = "";

    // HÀM ĐĂNG NHẬP
    function login() {
        const u = document.getElementById("user-name").value;
        const p = document.getElementById("pass-word").value;

        database.ref("users/" + u).once("value", (snapshot) => {
            if (snapshot.exists()) {
                const userData = snapshot.val();
                if (userData.password === p) {
                    currentUsername = u;
                    showChat();
                } else { alert("Sai mật khẩu!"); }
            } else { alert("Tài khoản không tồn tại!"); }
        });
    }

    // HÀM ĐĂNG KÝ
    function register() {
        const u = document.getElementById("user-name").value;
        const p = document.getElementById("pass-word").value;
        if (!u || !p) { alert("Vui lòng nhập đủ!"); return; }

        database.ref("users/" + u).once("value", (snapshot) => {
            if (snapshot.exists()) {
                alert("Tài khoản đã tồn tại!");
            } else {
                database.ref("users/" + u).set({ password: p, createdAt: Date.now() })
                .then(() => alert("Đăng ký thành công! Hãy đăng nhập."));
            }
        });
    }

    function showChat() {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("chat-screen").style.display = "flex";
        loadMessages();
    }

    function loadMessages() {
        database.ref("messages").limitToLast(50).on("value", (snapshot) => {
            const chatWindow = document.getElementById("chat-window");
            chatWindow.innerHTML = "";
            snapshot.forEach((child) => {
                const data = child.val();
                const isMe = data.sender === currentUsername;
                const msgDiv = document.createElement("div");
                msgDiv.className = `message ${isMe ? 'mine' : 'others'}`;
                msgDiv.innerHTML = `<span class="sender-name">${data.sender}</span>${data.text}`;
                chatWindow.appendChild(msgDiv);
            });
            chatWindow.scrollTop = chatWindow.scrollHeight;
        });
    }

    function sendMessage() {
        const text = document.getElementById("msg-input").value;
        if (text.trim() !== "") {
            database.ref("messages").push({
                sender: currentUsername,
                text: text,
                serverTime: firebase.database.ServerValue.TIMESTAMP
            });
            document.getElementById("msg-input").value = "";
        }
    }

    document.getElementById("msg-input").addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
</script>

</body>
</html>
