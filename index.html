<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Chat - NhanC</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --bg-dark: #36393f;
            --bg-side: #2f3136;
            --accent: #5865f2;
            --text-main: #dcddde;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        /* Header chuyên nghiệp hơn */
        .header { 
            background-color: #202225; 
            padding: 15px 20px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .header h1 { margin: 0; font-size: 18px; color: white; }
        .status-dot { height: 10px; width: 10px; background-color: #3ba55d; border-radius: 50%; display: inline-block; margin-right: 5px; }

        /* Khung chat mượt mà */
        #chat-window { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px;
            scroll-behavior: smooth;
        }

        /* Tùy chỉnh thanh cuộn */
        #chat-window::-webkit-scrollbar { width: 8px; }
        #chat-window::-webkit-scrollbar-thumb { background: #202225; border-radius: 10px; }

        .message { 
            max-width: 75%; 
            padding: 12px 16px; 
            border-radius: 18px; 
            font-size: 15px;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.mine { 
            align-self: flex-end; 
            background: var(--accent); 
            color: white; 
            border-bottom-right-radius: 4px;
        }

        .message.others { 
            align-self: flex-start; 
            background-color: #4f545c; 
            color: white; 
            border-bottom-left-radius: 4px;
        }

        .sender-name { 
            font-size: 11px; 
            font-weight: bold; 
            margin-bottom: 4px; 
            display: block; 
            opacity: 0.8;
        }

        /* Vùng nhập liệu */
        .input-area { 
            background-color: #40444b; 
            padding: 20px; 
            display: flex; 
            gap: 12px;
            align-items: center;
        }

        input { 
            background-color: #2f3136; 
            border: 1px solid #202225; 
            padding: 12px 15px; 
            color: white; 
            border-radius: 25px; 
            outline: none; 
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent); }

        #user-input { width: 120px; }
        #msg-input { flex: 1; }

        button { 
            background-color: var(--accent); 
            color: white; 
            border: none; 
            width: 45px;
            height: 45px;
            border-radius: 50%; 
            cursor: pointer; 
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        button:hover { transform: scale(1.1); background-color: #4752c4; }

    </style>
</head>
<body>

<div class="header">
    <h1><span class="status-dot"></span> Cloud Chat Online</h1>
    <div style="font-size: 12px; opacity: 0.7;">Dev by NhanC</div>
</div>

<div id="chat-window"></div>

<div class="input-area">
    <input type="text" id="user-input" placeholder="Tên...">
    <input type="text" id="msg-input" placeholder="Aa">
    <button onclick="sendMessage()">➤</button>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://helotrongnhan-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    database.ref("messages").limitToLast(50).on("value", (snapshot) => {
        const chatWindow = document.getElementById("chat-window");
        chatWindow.innerHTML = "";
        const myName = document.getElementById("user-input").value;

        snapshot.forEach((child) => {
            const data = child.val();
            const isMe = data.sender === myName && myName !== "";
            
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            msgDiv.classList.add(isMe ? "mine" : "others");
            
            msgDiv.innerHTML = `<span class="sender-name">${data.sender}</span>${data.text}`;
            chatWindow.appendChild(msgDiv);
        });
        chatWindow.scrollTop = chatWindow.scrollHeight;
    });

    function sendMessage() {
        const sender = document.getElementById("user-input").value || "Ẩn danh";
        const text = document.getElementById("msg-input").value;
        if (text.trim() !== "") {
            database.ref("messages").push({
                sender: sender,
                text: text,
                serverTime: firebase.database.ServerValue.TIMESTAMP
            });
            document.getElementById("msg-input").value = "";
        }
    }

    document.getElementById("msg-input").addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
